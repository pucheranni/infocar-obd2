name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'
          cache: 'gradle'

      - name: Build web assets
        run: npm run build

      - name: Copy web assets to Android
        run: |
          mkdir -p android/app/src/main/assets/public
          cp -r www/* android/app/src/main/assets/public/

      - name: Build Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace 2>&1 | tee gradle-build.log || (echo "=== GRADLE LOG ===" && cat gradle-build.log | tail -n 80 && exit 1)

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AutoPulse-OBD2-Debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Publish Direct APK Download Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.2.0-beta
          name: AutoPulse OBD2 (APK Direto para Android)
          body: |
            ## 🚗 AutoPulse OBD2 - APK para Android
            Download direto do instalador Android sem necessidade de login ou descompactação.
            
            - **Renault Clio 2011**: Cálculo de consumo Speed-Density por sensor MAP (PID 010B) + IAT (PID 010F)
            - **Bluetooth Nativo**: Conexão direta com ELM327 Bluetooth clássico (SPP)
            - **Multimídia Simultânea**: Compatível com som do carro e chamadas ativas
          files: android/app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
