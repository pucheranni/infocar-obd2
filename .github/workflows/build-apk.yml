name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'
          cache: 'gradle'

      - name: Build web assets
        run: npm run build

      - name: Update Android Web Assets
        run: |
          mkdir -p android/app/src/main/assets/public
          cp -r www/* android/app/src/main/assets/public/

      - name: Ensure gradlew executable
        run: chmod +x android/gradlew

      - name: Build Debug APK
        working-directory: android
        run: |
          set -e -o pipefail
          ./gradlew assembleDebug --stacktrace 2>&1 | tee /tmp/gradle.log
          ls -la app/build/outputs/apk/debug/

      - name: Print Gradle Error to Annotations
        if: always()
        run: |
          python3 -c "import os; p = '/tmp/gradle.log'; (print('::error title=Gradle Error::' + '%0A'.join(line.strip() for line in open(p, errors='ignore').readlines()[-50:])) if os.path.exists(p) else print('::error::gradle.log not found'))"

      - name: Dump Build Log to Summary
        if: always()
        run: |
          echo "### 📋 Gradle Build Log Summary" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          tail -n 80 /tmp/gradle.log >> $GITHUB_STEP_SUMMARY || true
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AutoPulse-OBD2-Debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publish Direct APK Download Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.3.0
          name: AutoPulse Copilot v0.3.0 (APK Direto para Android)
          draft: false
          prerelease: false
          make_latest: true
          fail_on_unmatched_files: true
          body: |
            ## 🏎️ AutoPulse Copilot v0.3.0 — Agente de Gestão Veicular
            Download direto do instalador Android (`app-debug.apk`) sem necessidade de login ou descompactação.
            
            ### 🚀 Destaques da Versão v0.3.0:
            - **🏁 Need for Speed Shift Coach**: Barra de auxílio de troca de marcha calibrada para o motor Renault Clio D4D 1.0 16V (Eco 1800-2600, Power 3800-4700, Redline >5800) com filtro EMA (α=0.15) e histerese visual de ±75 RPM.
            - **⛽ One-Tap Refueling & Calibração em Malha Fechada**: Modal rápido de abastecimento (40L, 35L, 20L, Custom) com calibração adaptativa do fator físico de combustível em tanques cheios ≥15L.
            - **🗺️ Geofencing Semântico & Rotas em Campinas**: Detecção automática de origem e destino nos POIs habituais (Casa Chapadão, Tetra Pak Monte Mor, A2Z Valinhos, Unicamp, Super Texas Carnes SP e Mauá) com Last Known Good Position (LKGP 120s/300s).
            - **⚙️ Máquina de Estados Finita (FSM) & Anti-Stall**: Gestão de estados veiculares (`IDLE_STANDBY` ➔ `CONNECTING` ➔ `CONNECTED` ➔ `TRIP_ACTIVE` ➔ `PARKED_CONSOLIDATING` ➔ `SLEEP`) com debounce de 60s contra paradas em semáforos e amostragem adaptativa.
            - **📱 Android 14/15 Ready**: Foreground Service com tipos `connectedDevice|location` e permissões para execução contínua em segundo plano.
            - **📊 Persistência Relacional & Exportação CSV**: SQLite / IndexedDB com relatórios analíticos agrupados por corredor de mobilidade e download assíncrono em CSV.
            - **🧪 27 Testes Automatizados**: Suíte 100% verde validada com o executor nativo do Node.js (`npm test`).
          files: android/app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
